# Uso:
#   1) cp .env.example .env   y llena los valores reales (no subas .env a git)
#   2) docker compose up --build
#
# No se levanta un contenedor de Postgres para el backend principal: se conecta
# directo a Supabase. Postgres aquí se usa únicamente para la Evolution API.

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: AutomatasFinal.API
      Jwt__Audience: AutomatasFinal.Client
      Jwt__ExpirationMinutes: "60"
      Supabase__Url: ${SUPABASE_URL}
      Supabase__SecretKey: ${SUPABASE_SECRET_KEY}
      App__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:3000}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME:-AutomatasFinal}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN}
      Twilio__WhatsAppFrom: ${TWILIO_WHATSAPP_FROM}
      Recaptcha__SecretKey: ${RECAPTCHA_SECRET_KEY}
      NlpService__BaseUrl: ${NLP_SERVICE_URL:-http://nlp:8000}
      # Configuración de Evolution API para el envío de credenciales por WhatsApp:
      WhatsAppApi__BaseUrl: ${WHATSAPP_API_URL:-http://evolution-api:8080}
      WhatsAppApi__ApiKey: ${WHATSAPP_API_KEY:-}
      WhatsAppApi__Instance: ${WHATSAPP_INSTANCE:-credenciales}
    depends_on:
      - nlp
      - evolution-api
    restart: unless-stopped

  # Análisis lingüístico con spaCy (ES/EN/RU/ZH) y Stanza (AR).
  nlp:
    build:
      context: ./nlp-service
    environment:
      NLP_MAX_LOADED_MODELS: "2"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:8080/api}
      NUXT_PUBLIC_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
    depends_on:
      - backend
    restart: unless-stopped

  # --- SERVICIOS DE WHATSAPP (EVOLUTION API) ---
  postgres-evolution:
    image: postgres:15-alpine
    container_name: postgres-evolution
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: evolution
    ports:
      - "5432:5432"
    restart: unless-stopped

  evolution-api:
    image: mi-evolution-api
    container_name: evolution-api
    ports:
      - "8081:8080" 
    environment:
      - AUTHENTICATION_API_KEY=${WHATSAPP_API_KEY:-}
      - SERVER_URL=http://localhost:8081
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://root:root@postgres-evolution:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - CACHE_REDIS_ENABLED=false
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=true
    depends_on:
      - postgres-evolution
    restart: unless-stopped